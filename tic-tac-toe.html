<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        h1 {
            margin-bottom: 1rem;
            color: #333;
            font-size: 2rem;
        }

        .status {
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
            height: 1.5em;
            color: #666;
            font-weight: 500;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-gap: 8px;
            margin-bottom: 2rem;
            background: #667eea;
            padding: 8px;
            border-radius: 8px;
            margin-left: auto;
            margin-right: auto;
        }

        .cell {
            width: 100px;
            height: 100px;
            background: white;
            border: none;
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
            color: #333;
        }

        .cell:hover:not(:disabled) {
            background: #f0f0f0;
            transform: scale(1.05);
        }

        .cell:disabled {
            cursor: not-allowed;
        }

        .cell.x {
            color: #667eea;
        }

        .cell.o {
            color: #764ba2;
        }

        button.reset {
            padding: 0.75rem 2rem;
            font-size: 1rem;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            font-weight: 600;
        }

        button.reset:hover {
            background: #764ba2;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            }

            .container {
                background: #0f3460;
                color: #e0e0e0;
            }

            h1 {
                color: #e0e0e0;
            }

            .status {
                color: #b0b0b0;
            }

            .cell {
                background: #16213e;
                color: #e0e0e0;
            }

            .cell:hover:not(:disabled) {
                background: #1a3a52;
            }

            .cell.x {
                color: #667eea;
            }

            .cell.o {
                color: #ff6b6b;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tic Tac Toe</h1>
        <div class="status" id="status">You are X, AI is O</div>
        <div class="board" id="board">
            <button class="cell" data-index="0"></button>
            <button class="cell" data-index="1"></button>
            <button class="cell" data-index="2"></button>
            <button class="cell" data-index="3"></button>
            <button class="cell" data-index="4"></button>
            <button class="cell" data-index="5"></button>
            <button class="cell" data-index="6"></button>
            <button class="cell" data-index="7"></button>
            <button class="cell" data-index="8"></button>
        </div>
        <button class="reset" onclick="resetGame()">New Game</button>
    </div>

    <script>
        let board = ['', '', '', '', '', '', '', '', ''];
        let gameOver = false;
        const winConditions = [
            [0, 1, 2],
            [3, 4, 5],
            [6, 7, 8],
            [0, 3, 6],
            [1, 4, 7],
            [2, 5, 8],
            [0, 4, 8],
            [2, 4, 6]
        ];

        function checkWin(player) {
            return winConditions.some(condition =>
                condition.every(index => board[index] === player)
            );
        }

        function isBoardFull() {
            return board.every(cell => cell !== '');
        }

        function getAvailableMoves() {
            return board
                .map((cell, index) => cell === '' ? index : null)
                .filter(index => index !== null);
        }

        function minimax(depth, isMaximizing) {
            if (checkWin('O')) return 10 - depth;
            if (checkWin('X')) return depth - 10;
            if (isBoardFull()) return 0;

            if (isMaximizing) {
                let bestScore = -Infinity;
                const availableMoves = getAvailableMoves();
                for (let move of availableMoves) {
                    board[move] = 'O';
                    const score = minimax(depth + 1, false);
                    board[move] = '';
                    bestScore = Math.max(score, bestScore);
                }
                return bestScore;
            } else {
                let bestScore = Infinity;
                const availableMoves = getAvailableMoves();
                for (let move of availableMoves) {
                    board[move] = 'X';
                    const score = minimax(depth + 1, true);
                    board[move] = '';
                    bestScore = Math.min(score, bestScore);
                }
                return bestScore;
            }
        }

        function getAIMove() {
            let bestScore = -Infinity;
            let bestMove = null;
            const availableMoves = getAvailableMoves();

            for (let move of availableMoves) {
                board[move] = 'O';
                const score = minimax(0, false);
                board[move] = '';
                if (score > bestScore) {
                    bestScore = score;
                    bestMove = move;
                }
            }
            return bestMove;
        }

        function updateDisplay() {
            document.querySelectorAll('.cell').forEach((cell, index) => {
                cell.textContent = board[index];
                cell.classList.remove('x', 'o');
                if (board[index] === 'X') cell.classList.add('x');
                if (board[index] === 'O') cell.classList.add('o');
                cell.disabled = board[index] !== '' || gameOver;
            });
        }

        function updateStatus() {
            const statusEl = document.getElementById('status');
            if (checkWin('X')) {
                statusEl.textContent = '🎉 You won!';
                gameOver = true;
            } else if (checkWin('O')) {
                statusEl.textContent = '🤖 AI won!';
                gameOver = true;
            } else if (isBoardFull()) {
                statusEl.textContent = "It's a draw!";
                gameOver = true;
            }
        }

        function playerMove(index) {
            if (board[index] === '' && !gameOver) {
                board[index] = 'X';
                updateDisplay();
                updateStatus();

                if (!gameOver) {
                    setTimeout(() => {
                        const aiMove = getAIMove();
                        if (aiMove !== null) {
                            board[aiMove] = 'O';
                            updateDisplay();
                            updateStatus();
                        }
                    }, 500);
                }
            }
        }

        function resetGame() {
            board = ['', '', '', '', '', '', '', '', ''];
            gameOver = false;
            document.getElementById('status').textContent = 'You are X, AI is O';
            updateDisplay();
        }

        document.querySelectorAll('.cell').forEach(cell => {
            cell.addEventListener('click', (e) => {
                playerMove(parseInt(e.target.dataset.index));
            });
        });

        updateDisplay();
    </script>
</body>
</html>
